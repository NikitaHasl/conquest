<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Conquest</title>
</head>

<body>
  <header class="header">
    <div class="container">
      <div class="header__wrapper">
        <a href="#">
          <img src="imgs/header-logo.svg" alt="conquest logo" class="header__logo">
        </a>
        <nav class="header__navigation">
          <ul class="header__navigation-list">
            <li class="header__navigation-item">
              <a href="#" class="header__navigation-link">Каталог</a>
            </li>
            <li class="header__navigation-item">
              <a href="#" class="header__navigation-link">Акции</a>
            </li>
            <li class="header__navigation-item">
              <a href="#" class="header__navigation-link">Доставка</a>
            </li>
            <li class="header__navigation-item">
              <a href="#" class="header__navigation-link">Контакты</a>
            </li>
          </ul>
        </nav>
        <div class="header__icons">
          <a href="#" class="header__icon">
            <img src="imgs/icon-search.svg" alt="search icon" class="header__icon-img">
          </a>
          <a href="#" class="header__icon">
            <img src="imgs/icon-heart.svg" alt="heart icon" class="header__icon-img">
            <span class="header__icon-badge">3</span>
          </a>
          <a href="#" class="header__icon">
            <img src="imgs/icon-cart.svg" alt="cart icon" class="header__icon-img">
          </a>
        </div>
      </div>
    </div>
  </header>
  <section class="section-intro">
    <div class="container">
      <div class="section-intro__wrapper">
        <div class="section-intro__text">
          <h1 class="title-1 margin-bottom-l">Весна/Лето 2026 <br><span>Коллекция</span></h1>
          <p class="section-intro__desc margin-bottom-l">Швейцарские часы в наличии в Москве<br>
            и с доставкой по всему миру</p>
          <button class="catalog_btn">Смотреть каталог</button>
        </div>
        <div class="section-intro__image">
          <img src="imgs/watch_main.png" alt="Elegant Rado watch for every occasion" class="section-intro__img">
          <p class="section-intro__characteristic section-intro__characteristic_1">22 000 ₽</p>
          <p class="section-intro__characteristic section-intro__characteristic_2">28 мм диаметр</p>
        </div>
      </div>
    </div>
  </section>
  <section class="section-top">
    <div class="container">
      <div class="section-top__wrapper">
        <h2 class="title-2 text-align-center margin-bottom-xl">Популярные модели</h2>
        <a href="#" class="section-top__link-all">Смотреть все</a>
        <div class="section-top__cards">
          <div class="section-top__card">
            <p class="section-top__card-name">RADO</p>
            <p class="section-top__card-price">65 300 ₽</p>
            <div class="section-top__card-img-shadow margin-bottom-s">
              <img src="imgs/watch_top_1.png"
                alt="Rado Automatic chronograph watch with silver dial and black leather strap"
                class="section-top__card-img">
            </div>
            <a href="#" class="section-top__card-link">Подробнее</a>
          </div>
          <div class="section-top__card">
            <p class="section-top__card-name">BVLGARI</p>
            <p class="section-top__card-price">81 700 ₽</p>
            <div class="section-top__card-img-shadow margin-bottom-s">
              <img src="imgs/watch_top_2.png"
                alt="Bvlgari chronograph watch with black dial, gold case, and black leather strap"
                class="section-top__card-img">
            </div>
            <a href="#" class="section-top__card-link">Подробнее</a>
          </div>
          <div class="section-top__card">
            <p class="section-top__card-name">BVLGARI</p>
            <p class="section-top__card-price">72 700 ₽</p>
            <div class="section-top__card-img-shadow margin-bottom-s">
              <img src="imgs/watch_top_1.png" alt="Bvlgari watch with white dial, steel case, and brown leather strap"
                class="section-top__card-img">
            </div>
            <a href="#" class="section-top__card-link">Подробнее</a>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>

</html>
